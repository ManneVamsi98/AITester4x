[project]
name = "tc-mcp"
version = "1.0.0"
description = "TestCreator MCP: a FastMCP server that exposes 5,000 VWO test cases as searchable, rankable tools."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "MIT" }
dependencies = [
    "fastmcp>=4.1.0,<5",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[project.scripts]
tc-mcp = "tc_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tc_mcp"]

[tool.hatch.build]
include = [
    "src/tc_mcp/data/vwo_5000_test_cases.csv",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
