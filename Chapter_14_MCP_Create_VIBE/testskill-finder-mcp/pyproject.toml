[project]
name = "tsf-mcp"
version = "1.0.0"
description = "Test Skill Finder MCP: a FastMCP server that exposes 50+ testing skills as searchable tools, resources and prompts."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "MIT" }
dependencies = [
    "fastmcp>=4.1.0,<5",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[project.scripts]
tsf-mcp = "tsf_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tsf_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "tsf_mcp/data/skills"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
